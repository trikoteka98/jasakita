<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="description" content="Aplikasi pemesanan jasa: pilih jasa yang kamu butuhkan, lihat katalog penyedia, dan pesan langsung." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <!-- Font, ikon, dan animasi diimpor dari paket lokal (lihat src/main.jsx) -->
    <title>JasaKita — Pemesanan Jasa</title>
    <!-- Terapkan tema sebelum halaman digambar, biar tidak berkedip -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('jasakita_theme') || 'system'
          var dark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', dark ? '#0b1220' : '#0d9488')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
